name: Release

# Đẩy 1 tag dạng v1.1.0 -> CI build installer (Windows + macOS) rồi tạo GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # cần để electron-builder tạo Release + upload asset

jobs:
  release:
    strategy:
      fail-fast: false        # 1 nền tảng lỗi không hủy nền tảng còn lại
      matrix:
        include:
          - os: windows-latest
            platform: --win     # -> Node Version Manager Setup X.Y.Z.exe + latest.yml
          - os: macos-latest
            platform: --mac     # -> Node Version Manager-X.Y.Z(-arm64).dmg

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main
        run: npm run build

      - name: Package and publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # build không ký số (cả win lẫn mac)
        run: npx electron-builder ${{ matrix.platform }} --publish always
