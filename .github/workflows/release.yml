name: Release

# Đẩy 1 tag dạng v1.0.2 -> CI build installer + latest.yml rồi tạo GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # cần để electron-builder tạo Release + upload asset

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main
        run: npm run build

      - name: Package installer and publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # build không ký số
        run: npx electron-builder --win --publish always
